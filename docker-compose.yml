services:
  bot:
    image: ghcr.io/therpgclub/therpgclub-bot:latest
    env_file: .env
    environment:
      DOCKER_BACKUP_ENABLED: "false"
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1    

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG:-~/.docker}/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: "120"
      WATCHTOWER_CLEANUP: "true"
      DOCKER_API_VERSION: "1.45"
    restart: unless-stopped
