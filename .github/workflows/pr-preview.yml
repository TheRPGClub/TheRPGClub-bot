name: PR preview
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('PR preview {0} {1}', inputs.action, inputs.pr)
    || github.event.pull_request.title || github.workflow }}

# Runs a PR branch in the test guild under the dev bot on the self-hosted runner.
# Deploys happen only on request: the user-invoked `/test-guild` skill in Claude Code
# dispatches this workflow with a PR number, so several PRs can be in flight while the
# user picks which one the test guild runs. One preview at a time: a deploy replaces
# whatever is running. PR events never deploy; they only report a preview that fell
# behind, tear down one whose PR closed or lost its Testing steps, and reap orphans.
# Setup and manual controls: docs/pr-preview.md.

on:
  pull_request:
    types: [synchronize, edited, closed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: deploy a PR, stop the running preview, or reap an orphaned one
        type: choice
        options: [deploy, stop, reap]
        default: deploy
      pr:
        description: PR number to deploy (deploy only)
        type: string
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  PREVIEW_SCRIPT: scripts/preview/preview.sh
  COMMENT_MODULE: ${{ github.workspace }}/scripts/preview/comment.mjs
  PLAN_MODULE: ${{ github.workspace }}/scripts/preview/plan.mjs

jobs:
  # Checks a requested PR with the parser `/conduct` uses before anything is built. It
  # sits outside the deploy concurrency group, so a refused request never cancels a
  # deploy in flight. A refusal fails the run, which is what `/test-guild` reports.
  plan:
    if: >-
      vars.PR_PREVIEW_ENABLED == 'true'
      && github.event_name == 'workflow_dispatch'
      && inputs.action == 'deploy'
    runs-on: [self-hosted, rpgclub-preview]
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.plan.outputs.pr }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The input and the PR body reach the script through env only.
      - name: Check the PR can be deployed
        id: plan
        uses: actions/github-script@v8
        env:
          PR_INPUT: ${{ inputs.pr }}
        with:
          script: |
            const m = await import(process.env.PLAN_MODULE);
            const input = (process.env.PR_INPUT ?? "").trim().replace(/^#/, "");
            if (!/^[1-9]\d*$/.test(input)) {
              core.setFailed(`Not a PR number: "${input}".`);
              return;
            }
            const { owner, repo } = context.repo;
            let data;
            try {
              ({ data } = await github.rest.pulls.get({
                owner, repo, pull_number: Number(input),
              }));
            } catch (err) {
              if (err.status !== 404) throw err;
              core.setFailed(`PR #${input} does not exist.`);
              return;
            }
            const { refusal, kind } = m.deployRefusal({
              pr: data, repository: `${owner}/${repo}`,
            });
            core.info(`PR #${data.number} at ${data.head.sha}, Testing steps: ${kind}`);
            if (refusal) {
              core.setFailed(refusal);
              return;
            }
            core.setOutput("pr", String(data.number));
            core.setOutput("sha", data.head.sha);

  deploy:
    needs: plan
    # Fork PRs never reach the self-hosted runner: their code would run next to the
    # dev token and the production container. `plan` refuses them. PR_PREVIEW_ENABLED
    # (a repo variable) stays unset until the runner exists, so a dispatch does not sit
    # on a job nothing can pick up.
    if: >-
      vars.PR_PREVIEW_ENABLED == 'true'
      && github.event_name == 'workflow_dispatch'
      && needs.plan.outputs.sha != ''
    runs-on: [self-hosted, rpgclub-preview]
    timeout-minutes: 20
    concurrency:
      group: pr-preview-deploy
      cancel-in-progress: true
    env:
      PR: ${{ needs.plan.outputs.pr }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Report building
        uses: actions/github-script@v8
        with:
          script: |
            const m = await import(process.env.COMMENT_MODULE);
            const pr = Number(process.env.PR);
            await m.upsertPreviewComment({
              github, context, pr, state: "building", sha: process.env.SHA,
            });

      - name: Deploy preview
        id: deploy
        run: bash "$PREVIEW_SCRIPT" deploy "$PR" "$SHA"

      - name: Report replaced preview
        if: always() && steps.deploy.outputs.replaced_pr != ''
        uses: actions/github-script@v8
        env:
          REPLACED_PR: ${{ steps.deploy.outputs.replaced_pr }}
        with:
          script: |
            const m = await import(process.env.COMMENT_MODULE);
            await m.upsertPreviewComment({
              github, context, pr: Number(process.env.REPLACED_PR),
              state: "replaced", by: Number(process.env.PR),
            });

      # A close, or an edit removing the Testing steps, that landed while this run was
      # building would otherwise leave the preview up after its teardown already ran,
      # even when the deploy then failed.
      - name: Check the PR still wants a preview
        id: wanted
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const m = await import(process.env.PLAN_MODULE);
            const { wanted, reason, head } = await m.previewWanted({
              github, context, pr: Number(process.env.PR),
            });
            core.setOutput("wanted", wanted);
            core.setOutput("reason", reason);
            core.setOutput("head", head);

      - name: Tear down for a PR closed or untested mid-deploy
        if: >-
          always()
          && steps.wanted.outputs.wanted != ''
          && steps.wanted.outputs.wanted != 'yes'
        run: bash "$PREVIEW_SCRIPT" teardown "$PR"

      - name: Report result
        if: always()
        uses: actions/github-script@v8
        env:
          JOB_STATUS: ${{ job.status }}
          WANTED: ${{ steps.wanted.outputs.wanted }}
          REASON: ${{ steps.wanted.outputs.reason }}
          HEAD: ${{ steps.wanted.outputs.head }}
          CONTAINER: ${{ steps.deploy.outputs.container }}
        with:
          script: |
            const m = await import(process.env.COMMENT_MODULE);
            const status = process.env.JOB_STATUS;
            let state = "failed";
            if (status === "cancelled") state = "superseded";
            else if (process.env.WANTED === "closed") state = "removed";
            else if (process.env.WANTED === "untested") state = "untested";
            else if (process.env.WANTED === "malformed") state = "malformed";
            else if (status === "success") state = "running";
            // A push during the build found no container of this PR to mark behind.
            const head = process.env.HEAD;
            const behind = state === "running" && head && head !== process.env.SHA;
            await m.upsertPreviewComment({
              github, context, pr: Number(process.env.PR),
              state: behind ? "stale" : state,
              sha: behind ? head : process.env.SHA, running: process.env.SHA,
              container: process.env.CONTAINER, reason: process.env.REASON,
            });

  # A push never redeploys. When the pushed PR holds the test guild, its comment says the
  # preview is now behind, so the user can redeploy with `/test-guild` when they choose.
  stale:
    if: >-
      vars.PR_PREVIEW_ENABLED == 'true'
      && github.event_name == 'pull_request'
      && github.event.action == 'synchronize'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rpgclub-preview]
    timeout-minutes: 5
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Find running preview
        id: current
        run: |
          read -r pr sha < <(bash "$PREVIEW_SCRIPT" current) || true
          echo "pr=${pr:-}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha:-}" >> "$GITHUB_OUTPUT"

      - name: Report preview behind
        if: >-
          steps.current.outputs.pr == env.PR
          && steps.current.outputs.sha != env.SHA
        uses: actions/github-script@v8
        env:
          RUNNING: ${{ steps.current.outputs.sha }}
        with:
          script: |
            const m = await import(process.env.COMMENT_MODULE);
            await m.upsertPreviewComment({
              github, context, pr: Number(process.env.PR), state: "stale",
              sha: process.env.SHA, running: process.env.RUNNING,
            });

  # An edit that removes the Testing steps tears down that PR's preview, since
  # `/conduct` has nothing left to run against it. Adding them never deploys.
  # An edit can land on a closed PR, whose preview the teardown job already handled.
  edited:
    if: >-
      vars.PR_PREVIEW_ENABLED == 'true'
      && github.event_name == 'pull_request'
      && github.event.action == 'edited'
      && github.event.changes.body != null
      && github.event.pull_request.state == 'open'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rpgclub-preview]
    timeout-minutes: 5
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The body is attacker-controlled: it reaches the script through env only.
      - name: Read Testing steps
        id: plan
        uses: actions/github-script@v8
        env:
          BODY: ${{ github.event.pull_request.body }}
        with:
          script: |
            const m = await import(process.env.PLAN_MODULE);
            const { kind, reason } = m.testingSteps(process.env.BODY);
            core.info(`Testing steps: ${kind}`);
            core.setOutput("kind", kind);
            core.setOutput("reason", reason);

      - name: Tear down this PR's preview
        id: teardown
        if: steps.plan.outputs.kind != 'ok'
        run: bash "$PREVIEW_SCRIPT" teardown "$PR"

      - name: Report no Testing steps
        if: steps.plan.outputs.kind != 'ok'
        uses: actions/github-script@v8
        env:
          KIND: ${{ steps.plan.outputs.kind }}
          REASON: ${{ steps.plan.outputs.reason }}
        with:
          script: |
            const m = await import(process.env.COMMENT_MODULE);
            const malformed = process.env.KIND === "malformed";
            await m.upsertPreviewComment({
              github, context, pr: Number(process.env.PR),
              state: malformed ? "malformed" : "untested",
              reason: process.env.REASON, onlyIfExists: true,
            });

  # Shares the deploy group, so a stop also cancels a deploy still building.
  stop:
    if: >-
      vars.PR_PREVIEW_ENABLED == 'true'
      && github.event_name == 'workflow_dispatch'
      && inputs.action == 'stop'
    runs-on: [self-hosted, rpgclub-preview]
    timeout-minutes: 5
    concurrency:
      group: pr-preview-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Find running preview
        id: current
        run: echo "pr=$(bash "$PREVIEW_SCRIPT" current-pr)" >> "$GITHUB_OUTPUT"

      - name: Tear down preview
        id: teardown
        if: steps.current.outputs.pr != ''
        env:
          PR: ${{ steps.current.outputs.pr }}
        run: bash "$PREVIEW_SCRIPT" teardown "$PR"

      - name: Report torn down
        if: steps.teardown.outputs.removed == '1'
        uses: actions/github-script@v8
        env:
          PR: ${{ steps.current.outputs.pr }}
        with:
          script: |
            const m = await import(process.env.COMMENT_MODULE);
            await m.upsertPreviewComment({
              github, context, pr: Number(process.env.PR), state: "removed",
            });

  teardown:
    if: >-
      vars.PR_PREVIEW_ENABLED == 'true'
      && github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rpgclub-preview]
    timeout-minutes: 5
    concurrency:
      group: pr-preview-teardown-${{ github.event.pull_request.number }}
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Tear down preview
        id: teardown
        run: bash "$PREVIEW_SCRIPT" teardown "$PR"

      - name: Report torn down
        if: steps.teardown.outputs.removed == '1'
        uses: actions/github-script@v8
        with:
          script: |
            const m = await import(process.env.COMMENT_MODULE);
            await m.upsertPreviewComment({
              github, context, pr: Number(process.env.PR), state: "removed",
            });

  # Hourly reaper for a preview whose teardown never ran or failed.
  reap:
    if: >-
      vars.PR_PREVIEW_ENABLED == 'true'
      && (github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.action == 'reap'))
    runs-on: [self-hosted, rpgclub-preview]
    timeout-minutes: 5
    concurrency:
      group: pr-preview-reap
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Find running preview
        id: current
        run: echo "pr=$(bash "$PREVIEW_SCRIPT" current-pr)" >> "$GITHUB_OUTPUT"

      - name: Check its PR is still open
        id: open
        if: steps.current.outputs.pr != ''
        uses: actions/github-script@v8
        env:
          PR: ${{ steps.current.outputs.pr }}
        with:
          script: |
            const m = await import(process.env.COMMENT_MODULE);
            const open = await m.isPullRequestOpen({
              github, context, pr: Number(process.env.PR),
            });
            core.setOutput("open", String(open));

      - name: Reap orphaned preview
        id: reap
        if: steps.open.outputs.open == 'false'
        env:
          PR: ${{ steps.current.outputs.pr }}
        run: bash "$PREVIEW_SCRIPT" teardown "$PR"

      - name: Report torn down
        if: steps.reap.outputs.removed == '1'
        uses: actions/github-script@v8
        env:
          PR: ${{ steps.current.outputs.pr }}
        with:
          script: |
            const m = await import(process.env.COMMENT_MODULE);
            await m.upsertPreviewComment({
              github, context, pr: Number(process.env.PR), state: "removed",
            });
