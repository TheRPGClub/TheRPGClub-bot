# Versions this repo on every merge to main (spec TheRPGClub-api#510, ticket #1595).
# The shared job lives in the api repo; it does nothing until this repo has a v* tag.
name: Versioning

on:
  push:
    branches: [main]

jobs:
  version:
    permissions:
      contents: write
      pull-requests: read
    uses: TheRPGClub/TheRPGClub-api/.github/workflows/versioning-reusable.yml@main
    with:
      repo_key: bot
    secrets:
      release_api_token: ${{ secrets.RPGCLUB_RELEASE_API_TOKEN }}
