# Checks the pull request title versioning reads (spec TheRPGClub-api#510, ticket #1595).
# Branch protection requires the check "PR title / Title check".
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

jobs:
  pr-title:
    name: PR title
    permissions:
      contents: read
    uses: TheRPGClub/TheRPGClub-api/.github/workflows/pr-title-reusable.yml@main
